<div id="loader-overlay" style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(255,255,255,.96);align-items:center;justify-content:center;flex-direction:column;">
  <div style="width:54px;height:54px;border:5px solid #eee;border-top-color:#d89300;border-radius:50%;animation:ldspin .8s linear infinite;"></div>
  <p style="margin-top:18px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;color:#3a3f47;font-weight:600;">Carregando...</p>

<style>@keyframes ldspin{to{transform:rotate(360deg);}}</style>
<script>
(function(){
  function validaCPF(cpf){
    cpf=(cpf||'').replace(/\D/g,'');
    if(cpf.length!==11) return false;
    if(/^(\d)\1{10}$/.test(cpf)) return false;
    var s=0,i,d;
    for(i=0;i<9;i++) s+=parseInt(cpf.charAt(i),10)*(10-i);
    d=11-(s%11); if(d>=10) d=0;
    if(d!==parseInt(cpf.charAt(9),10)) return false;
    s=0;
    for(i=0;i<10;i++) s+=parseInt(cpf.charAt(i),10)*(11-i);
    d=11-(s%11); if(d>=10) d=0;
    if(d!==parseInt(cpf.charAt(10),10)) return false;
    return true;
  }
  function maskCPF(v){
    v=v.replace(/\D/g,'').slice(0,11);
    if(v.length>9) return v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
    if(v.length>6) return v.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
    if(v.length>3) return v.replace(/(\d{3})(\d{1,3})/,'$1.$2');
    return v;
  }
  var cpf=document.getElementById('txtCPF');
  var cpfErro=document.getElementById('cpf-erro');
  var senha=document.getElementById('txtSenha');
  var toggle=document.getElementById('toggle-senha');
  var eyeOpen=document.getElementById('eye-open');
  var eyeClosed=document.getElementById('eye-closed');
  var form=document.getElementById('frmLogin');
  var loginErro=document.getElementById('login-erro');
  var overlay=document.getElementById('loader-overlay');

  if(cpf){
    cpf.addEventListener('input',function(){
      cpf.value=maskCPF(cpf.value);
      var digits=cpf.value.replace(/\D/g,'');
      cpfErro.style.display=(digits.length===11 && !validaCPF(digits))?'block':'none';
      if(loginErro) loginErro.style.display='none';
    });
  }
  if(toggle && senha){
    toggle.addEventListener('click',function(){
      if(senha.type==='password'){ senha.type='text'; eyeOpen.style.display='none'; eyeClosed.style.display='flex'; toggle.setAttribute('aria-label','Ocultar senha'); }
      else { senha.type='password'; eyeOpen.style.display='flex'; eyeClosed.style.display='none'; toggle.setAttribute('aria-label','Mostrar senha'); }
    });
  }
  if(form){
    form.addEventListener('submit',function(e){
      e.preventDefault();
      loginErro.style.display='none';
      var digits=cpf.value.replace(/\D/g,'');
      if(!validaCPF(digits)){ cpfErro.style.display='block'; cpf.focus(); return; }
      if(!senha.value){ senha.focus(); return; }
      overlay.style.display='flex';
      document.documentElement.style.overflow='hidden'; document.body.style.overflow='hidden';
      setTimeout(function(){
        overlay.style.display='none';
        document.documentElement.style.overflow=''; document.body.style.overflow='';
        loginErro.style.display='block';
      },2000);
    });
  }
})();
</script>
